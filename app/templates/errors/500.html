{% extends "base.html" %}
{% block title %}Server Error - Octagon Woodshop Log{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-4">500</h1>
    <p class="lead">Something went wrong on our end.</p>
    <p class="text-muted">The error has been logged. Please try again; if it
        keeps happening, let an administrator know.</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-primary">Back to start</a>
</div>
{% endblock %}
