{% extends "base.html" %}
{% block title %}Student Lookup - Octagon Woodshop Log{% endblock %}

{% block content %}
<h2>Student Sign-In &mdash; {{ active_session.area.name }}</h2>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Look Up Student</div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="student_id" class="form-label">Student ID (Banner ID)</label>
                        <input type="text" class="form-control form-control-lg"
                               id="student_id" name="student_id"
                               placeholder="e.g. 900123456" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Look Up</button>
                </form>
            </div>
        </div>
        <div class="text-center mt-3">
            <a href="{{ url_for('student.register') }}" class="text-muted">
                Register a new student
            </a>
        </div>
    </div>
</div>
{% endblock %}
