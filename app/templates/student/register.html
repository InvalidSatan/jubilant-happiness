{% extends "base.html" %}
{% block title %}Register Student - Octagon Log{% endblock %}

{% block content %}
<h2>Register New Student</h2>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="student_id" class="form-label">Student ID (Banner ID)</label>
                        <input type="text" class="form-control" id="student_id"
                               name="student_id" value="{{ prefill_id }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="display_name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="display_name"
                               name="display_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email (optional)</label>
                        <input type="email" class="form-control" id="email" name="email">
                        <div class="form-text">Needed for ASULearn integration.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
