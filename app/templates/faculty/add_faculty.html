{% extends "base.html" %}
{% block title %}Add Faculty - Octagon Woodshop Log{% endblock %}

{% block content %}
<h2>Add Faculty Account</h2>

<div class="row">
    <div class="col-md-6">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Display Name</label>
                <input type="text" name="display_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email (optional)</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3 form-check">
                <input class="form-check-input" type="checkbox" name="is_primary_admin"
                       id="is_primary_admin">
                <label class="form-check-label" for="is_primary_admin">Primary Admin</label>
            </div>
            <button type="submit" class="btn btn-primary">Create Faculty Account</button>
            <a href="{{ url_for('faculty.faculty_accounts') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
