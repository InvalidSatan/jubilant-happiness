{% extends "base.html" %}
{% block title %}Edit Monitor - Octagon Woodshop Log{% endblock %}

{% block content %}
<h2>Edit Monitor: {{ monitor.display_name }}</h2>

<div class="row">
    <div class="col-md-6">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" value="{{ monitor.username }}" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label">Display Name</label>
                <input type="text" name="display_name" class="form-control"
                       value="{{ monitor.display_name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">New Password (leave blank to keep current)</label>
                <input type="password" name="password" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Authorized Areas</label>
                {% set monitor_area_ids = monitor.areas | map(attribute='id') | list %}
                {% for area in areas %}
                <div class="form-check">
                    <input class="form-check-input" type="checkbox"
                           name="area_ids" value="{{ area.id }}" id="area_{{ area.id }}"
                           {{ 'checked' if area.id in monitor_area_ids }}>
                    <label class="form-check-label" for="area_{{ area.id }}">
                        {{ area.name }}
                    </label>
                </div>
                {% endfor %}
            </div>
            <div class="mb-3 form-check">
                <input class="form-check-input" type="checkbox" name="is_admin" id="is_admin"
                       {{ 'checked' if monitor.is_admin }}>
                <label class="form-check-label" for="is_admin">Admin privileges</label>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('faculty.monitors') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
